<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-container">
    <div class="calculator">
      <div class="calculator-header">
        <h1>Calculator</h1>
        <p>Standard Mode</p>
      </div>

      <div class="display">
        <div id="expression" class="expression"></div>
        <div id="result" class="result">0</div>
      </div>

      <div class="buttons">
        <button class="btn control" data-action="clear">AC</button>
        <button class="btn control" data-action="clear-entry">CE</button>
        <button class="btn control" data-action="delete">DEL</button>
        <button class="btn operator" data-value="/">÷</button>

        <button class="btn function" data-action="square">x²</button>
        <button class="btn function" data-action="sqrt">√x</button>
        <button class="btn function" data-action="reciprocal">1/x</button>
        <button class="btn operator" data-value="*">×</button>

        <button class="btn operator" data-value="(">(</button>
        <button class="btn operator" data-value=")">)</button>
        <button class="btn operator" data-value="%">%</button>
        <button class="btn operator" data-value="-">−</button>

        <button class="btn number" data-value="7">7</button>
        <button class="btn number" data-value="8">8</button>
        <button class="btn number" data-value="9">9</button>
        <button class="btn operator" data-value="+">+</button>

        <button class="btn number" data-value="4">4</button>
        <button class="btn number" data-value="5">5</button>
        <button class="btn number" data-value="6">6</button>
        <button class="btn function" data-action="toggle-sign">±</button>

        <button class="btn number" data-value="1">1</button>
        <button class="btn number" data-value="2">2</button>
        <button class="btn number" data-value="3">3</button>
        <button class="btn equal tall" data-action="calculate">=</button>

        <button class="btn number zero" data-value="0">0</button>
        <button class="btn number" data-value=".">.</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
